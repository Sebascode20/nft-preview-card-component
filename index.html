<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | NFT preview card component</title>
    <meta
      name="description"
      content="NFT preview card featuring Equilibrium #3429, a digital collectible from the Equilibrium collection. Discover its Ethereum price, remaining time, and creator information."
    />

    <meta
      name="keywords"
      content="NFT, NFT preview card, Equilibrium NFT, digital collectibles, Ethereum, ETH, NFT collection, NFT card component"
    />
    <meta name="author" content="Sebastian" />
    <meta name="title" content="NFT preview card component" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NFT Preview Card | Equilibrium #3429" />
    <meta
      property="og:description"
      content="Discover Equilibrium #3429, a digital collectible from the Equilibrium NFT collection. Explore its Ethereum price, creator, and remaining time."
    />
    <meta
      property="og:image"
      content="./images/NFT-preview-card-component.png"
    />
    <meta property="og:url" content="https://previewcomponentcardnft.netlify.app/" />
    <meta property="og:site_name" content="NFT Preview Card Component" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <header>
          <img
            class="card_image"
            src="./images/image-equilibrium.jpg"
            alt="NFT cube"
          />
          <img class="eye-image" src="./images/icon-view.svg" alt="Icon view" />
        </header>
        <h1 class="card_title">Equilibrium #3429</h1>
        <p class="card_description">
          Our Equilibrium collection promotes balance and calm.
        </p>
        <div class="card_productFeatures">
          <img src="./images/icon-ethereum.svg" alt="Icon ethereum" />
          <p class="amount-eth">0.041ETH</p>
          <img src="./images/icon-clock.svg" alt="Icon clock" />
          <p class="day-counter">3 days left</p>
        </div>
        <hr />
        <footer>
          <img src="./images/image-avatar.png" alt="avatar" />
          <p class="card_author">Creation of <span>Jules Wyvern</span></p>
        </footer>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Sebastian</a>.
    </footer>
  </body>
</html>
